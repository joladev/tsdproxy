services:
  tsdproxy:
    image: almeidapaulopt/tsdproxy:2.1.0
    restart: unless-stopped
    environment:
      - TSDPROXY_AUTHKEY
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tsdproxy_data:/data
    networks:
      - dokploy-network

volumes:
  tsdproxy_data:

networks:
  dokploy-network:
    external: true
